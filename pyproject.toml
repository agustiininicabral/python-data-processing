[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-data-processing"
version = "1.0.0"
description = "Validated and reproducible sales data processing pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Agustin Cabral" }]
dependencies = ["pandas>=2.1,<4.0", "numpy>=1.26,<3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0", "pytest-cov>=5.0,<8.0"]

[project.scripts]
process-sales = "data_processing.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["data_processing"]

[tool.coverage.report]
show_missing = true
fail_under = 85
